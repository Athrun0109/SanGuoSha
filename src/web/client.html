<!doctype html>
<meta charset="utf-8">
<title>三国杀 · 对局</title>
<style>
  /* 浅色底、黑字。以后要贴武将图,白底比深色底好配得多。 */
  :root {
    --line: #d4d4d4;
    --line-soft: #ebebeb;
    --ink: #111;
    --ink-dim: #767676;
    /* 比 ink-dim 再淡一档:表示"现在点不了",要一眼看出是被压掉的 */
    --dim2: #b3b3b3;
    --red: #c0392b;
    --amber: #b45309;
    --sel: #2563eb;
    --wei: #2563eb; --shu: #c0392b; --wu: #16a34a; --qun: #a16207;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #fff; color: var(--ink);
    font: 13px/1.5 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  }
  body { display: flex; flex-direction: column; }

  /* ——— 顶栏 ——— */
  #bar {
    display: flex; align-items: center; gap: 16px;
    padding: 6px 14px; border-bottom: 1px solid var(--line);
    font-size: 12px; color: var(--ink-dim); flex: none;
  }
  #bar b { color: var(--ink); font-weight: 600; }
  #bar .sp { flex: 1; }
  #dot { width: 7px; height: 7px; border-radius: 50%; background: #16a34a; }
  #dot.off { background: #c0392b; }

  /* ——— 环形布局 ——— */
  #table {
    flex: 1; min-height: 0;
    display: grid; gap: 10px; padding: 12px;
    width: 100%; max-width: 1180px; margin: 0 auto;
    grid-template-columns: 1fr 1.35fr 1fr;
    grid-template-rows: auto auto 1fr auto;
    grid-template-areas:
      "tl  t    tr"
      "l   mid  r"
      "bl  mid  br"
      "me  me   me";
  }
  #mid {
    grid-area: mid; min-height: 0;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 6px;
  }
  /*
   * 底部一整条:左边是自己的信息,右边是操作条。
   *
   * 以前 #act 是动态插进 #table 的、又没给 grid-area —— 于是被网格自动塞进第一个
   * 空格子(左上角)。3 人局看着只是别扭,8 人局那格是别人的座位,会直接撞车。
   * 现在它固定住在这里:**自己的信息和自己的操作都在同一块面板上**,视线不用来回跑。
   */
  #bottom {
    grid-area: me; display: flex; gap: 10px; align-items: flex-start;
  }
  #me  { flex: 1; min-width: 0; }
  @media (max-width: 900px) { #bottom { flex-direction: column; } }

  /* ——— 角色框 ——— */
  .seat {
    border: 1px solid var(--line); border-left-width: 4px; border-radius: 6px;
    padding: 6px 9px; background: #fff; position: relative;
    align-self: start;
  }
  .seat.wei { border-left-color: var(--wei); }
  .seat.shu { border-left-color: var(--shu); }
  .seat.wu  { border-left-color: var(--wu); }
  .seat.qun { border-left-color: var(--qun); }

  .seat.cur { border-color: var(--amber); border-left-color: var(--amber); background: #fffbeb; }
  .seat.dead { opacity: .5; }
  .seat.dead .head { text-decoration: line-through; }

  /*
   * 可以点的角色框。**必须够显眼** —— 这里踩过一次:原来是 20% 不透明度的淡蓝阴影,
   * 而"当前回合"的琥珀色边框会盖在上面,结果轮到玩家选目标时他以为游戏卡死了。
   * 操作条里没有按钮的那些题(选目标、选牌),唯一的可点物就是棋盘上这些框。
   */
  .seat.pick {
    cursor: pointer;
    border-color: var(--sel) !important; border-left-color: var(--sel) !important;
  }
  .seat.pick:hover { background: #eff6ff; }
  /*
   * 角色框的压灰**只在"这道题要选人"时才上**(见 seatHtml)。
   * 角色框大半时间是在展示信息(血量、装备、距离),整局发灰会把这份信息一起压掉;
   * 而真要选目标的时候,灰掉够不着的人恰恰是最有用的对比。
   */
  .seat.off { opacity: .42; }
  .seat.on { box-shadow: 0 0 0 4px var(--sel); background: #dbeafe; }
  .seat .ord {
    position: absolute; top: -9px; left: -9px; width: 19px; height: 19px;
    border-radius: 50%; background: var(--sel); color: #fff;
    font-size: 11px; line-height: 19px; text-align: center;
  }

  .head { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .head .no { color: var(--ink-dim); font-size: 11px; }
  .head .gen { font-weight: 600; font-size: 14px; }
  .head .kd {
    font-size: 11px; padding: 0 4px; border-radius: 3px;
    border: 1px solid currentColor; line-height: 1.4;
  }
  .kd.wei { color: var(--wei); } .kd.shu { color: var(--shu); }
  .kd.wu  { color: var(--wu); }  .kd.qun { color: var(--qun); }

  .role { font-size: 11px; padding: 0 4px; border-radius: 3px; color: #fff; }
  .role.lord { background: var(--amber); }
  .role.loyalist { background: var(--wei); }
  .role.rebel { background: var(--red); }
  .role.renegade { background: #7c3aed; }
  .role.unknown { background: #fff; color: var(--ink-dim); border: 1px dashed var(--line); }
  /* 2v2 的两队。队伍是公开的,所以这两个色块一局到底都在 */
  .role.blue { background: #2563eb; }
  .role.red { background: #dc2626; }

  .badge {
    position: absolute; top: -8px; right: 8px;
    background: var(--amber); color: #fff; font-size: 11px;
    padding: 0 6px; border-radius: 9px;
  }

  .row { display: flex; gap: 8px; align-items: center; margin-top: 3px; flex-wrap: wrap; }
  .hp { letter-spacing: 1px; color: var(--red); }
  .hp .empty { color: #d0d0d0; }
  .k { color: var(--ink-dim); font-size: 11px; }
  .muted { color: var(--ink-dim); }

  /* ——— 牌 ——— */
  .card {
    display: inline-flex; align-items: baseline; gap: 3px;
    border: 1px solid var(--line); border-radius: 4px;
    padding: 1px 5px; background: #fff; font-size: 12px; white-space: nowrap;
    position: relative;
  }
  .card .s { font-weight: 600; }
  .card.red .s { color: var(--red); }
  .cards { display: flex; flex-wrap: wrap; gap: 4px; }

  /*
   * **可选/不可选** 和 **选中/未选中** 是两条互不相干的轴,以前被画成了同一种样式
   * (都是"蓝框 + 淡蓝底")。后果:弃牌时全部手牌都镶着蓝框,自己到底勾了哪几张
   * 完全看不出来。现在分开:
   *
   *   可选   黑字、能点、悬停才提示        不可选  整块压灰
   *   选中   **蓝色光圈**(box-shadow)   未选中  没有光圈
   *
   * 定下的规矩:光圈从此只代表"选中",别再拿它当"这个能点"用。
   */
  /* 浅蓝描边只是"这个是活的"的提示,和光圈完全不是一回事 ——
     弃牌那种全部可选的场合,没有它就一点"现在该点了"的迹象都没有 */
  .card.pick { cursor: pointer; color: var(--ink); border-color: #b9cdf0; }
  .card.pick:hover { border-color: var(--sel); background: #f0f6ff; }
  /* 压灰只在**有待答问题**时才加(见 cardHtml),平时的牌不该发灰 */
  .card.off { color: var(--dim2); border-color: var(--line-soft); background: #fcfcfc; }
  .card.off .s, .card.off .n, .card.off.red .s { color: var(--dim2); }
  .card.on {
    color: var(--ink); border-color: var(--sel); border-width: 2px;
    background: #dbeafe; box-shadow: 0 0 0 3px #2563eb66;
  }
  .card .ord {
    position: absolute; top: -8px; left: -8px; width: 17px; height: 17px;
    border-radius: 50%; background: var(--sel); color: #fff;
    font-size: 10px; line-height: 17px; text-align: center;
  }

  .judge { color: #7c3aed; }
  .back {
    display: inline-block; width: 13px; height: 18px; vertical-align: -3px;
    border: 1px solid var(--line); border-radius: 2px;
    background: repeating-linear-gradient(45deg, #f2f2f2 0 3px, #e4e4e4 3px 6px);
    margin-right: 2px;
  }

  /* ——— 自己 ——— */
  #me .seat { border-left-width: 4px; padding: 8px 11px; }
  #me .hand { margin-top: 6px; }
  #me .hand .card { font-size: 14px; padding: 5px 9px; }
  .skill {
    border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px;
    background: #fff; font-size: 12px;
  }
  /* 同上:可选=黑字,不可选=灰字,选中=蓝光圈。
     被动技(闭月、遗计这类不用自己发动的)因此一局到底都是灰的 —— 本来就点不了 */
  .skill.pick { cursor: pointer; color: var(--ink); border-color: #b9cdf0; }
  .skill.pick:hover { border-color: var(--sel); background: #f0f6ff; }
  .skill.off { color: var(--dim2); border-color: var(--line-soft); background: #fcfcfc; }
  .skill.on {
    color: var(--ink); border-color: var(--sel); border-width: 2px;
    background: #dbeafe; box-shadow: 0 0 0 3px #2563eb66;
  }

  /* ——— 操作条:贴在自己面板的右边 ——— */
  #act {
    display: none; border: 1px solid var(--sel); border-radius: 6px;
    background: #eff6ff; padding: 8px 11px;
    flex: 0 0 clamp(260px, 30%, 400px); align-self: stretch;
  }
  #act.on { display: block; }
  @media (max-width: 900px) { #act { flex: none; width: 100%; } }
  #act .q { font-weight: 600; margin-bottom: 6px; }
  #act .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  #act button {
    font: inherit; color: inherit; border: 1px solid var(--line);
    border-radius: 4px; padding: 3px 11px; background: #fff; cursor: pointer;
  }
  #act button:hover:not(:disabled) { background: #f0f0f0; }
  #act button.on {
    border-color: var(--sel); border-width: 2px;
    background: #dbeafe; box-shadow: 0 0 0 3px #2563eb66;
  }
  #act button:disabled { opacity: .45; cursor: default; }
  #act .go { background: #111; color: #fff; border-color: #111; }
  #act .go:hover:not(:disabled) { background: #333; }
  #act .cnt { color: var(--ink-dim); font-size: 12px; margin-left: 8px; }
  #act .err { color: var(--red); font-size: 12px; margin-top: 5px; }
  #act .where {
    font-size: 12px; color: var(--sel); margin-bottom: 6px;
    border-left: 3px solid var(--sel); padding-left: 7px;
  }

  /* ——— 战报:默认只露最近几行,点 ▼ 展开 ——— */
  #logbox { border: 1px solid var(--line-soft); border-radius: 6px; background: #fafafa; }
  #loghd {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 3px 9px; border-bottom: 1px solid var(--line-soft);
    font-size: 12px; color: var(--ink-dim); user-select: none;
  }
  #loghd:hover { background: #f2f2f2; }
  #loghd .sp { flex: 1; }
  #logbox #log {
    height: 76px; overflow-y: auto; padding: 6px 10px;
    font: 12px/1.6 ui-monospace, "Cascadia Mono", Consolas, monospace;
    white-space: pre-wrap; word-break: break-all;
  }
  #logbox.open #log { height: 42vh; }
  #logbox.open #caret { transform: rotate(180deg); }
  #caret { display: inline-block; transition: transform .15s; }
  #log .rd { color: var(--amber); font-weight: 600; }
  #log .tn { color: var(--wei); }
  #log .dmg { color: var(--red); }
  #log .die { color: var(--red); font-weight: 600; }

  /*
   * 中央牌堆:一道题的候选**本身就是牌**时(五谷丰登、观星),摊在中间给你看,
   * 而不是铺成一排文字按钮 —— 你是在挑牌,就该看见牌。
   *
   * 只画**不在你手上**的那些。手牌在下面的面板里本来就点得到,画两遍反而乱。
   */
  #tray {
    display: none; border: 1px solid var(--sel); border-radius: 6px;
    background: #eff6ff; padding: 9px 11px; margin-bottom: 6px;
  }
  #tray.on { display: block; }
  #tray .t { font-size: 12px; color: var(--sel); margin-bottom: 7px; }
  #tray .cards { gap: 7px; }
  #tray .card { font-size: 14px; padding: 6px 10px; }

  #deckinfo { display: flex; gap: 14px; padding: 0 2px; font-size: 12px; color: var(--ink-dim); }

  /* ——— 右上角的退出菜单 ——— */
  #exit {
    font: inherit; color: inherit; border: 1px solid var(--line); border-radius: 4px;
    padding: 1px 10px; background: #fff; cursor: pointer;
  }
  #exit:hover { background: #f0f0f0; }
  #menu {
    display: none; position: fixed; inset: 0; place-items: center;
    background: rgba(0,0,0,.28); z-index: 20;
  }
  #menu.on { display: grid; }
  #menu .box {
    background: #fff; border: 1px solid var(--line); border-radius: 8px;
    padding: 18px 22px; min-width: 250px;
  }
  #menu h4 { margin: 0 0 12px; font-size: 14px; }
  #menu button {
    display: block; width: 100%; margin-top: 7px;
    font: inherit; color: inherit; text-align: left;
    border: 1px solid var(--line); border-radius: 5px;
    padding: 7px 12px; background: #fff; cursor: pointer;
  }
  #menu button:hover { background: #f2f2f2; }
  #menu button.danger { color: var(--red); border-color: #f0c8c4; }
  #menu button.danger:hover { background: #fdf2f1; }
  #menu small { display: block; color: var(--ink-dim); font-size: 11px; font-weight: 400; }
  #menu .err { color: var(--red); font-size: 12px; margin-top: 9px; }

  #over {
    display: none; position: fixed; inset: 0; place-items: center;
    background: rgba(255,255,255,.86);
  }
  #over.on { display: grid; }
  #over div {
    border: 1px solid var(--line); border-radius: 8px; background: #fff;
    padding: 22px 34px; text-align: center; font-size: 17px;
  }
  #over small { display: block; margin-top: 6px; color: var(--ink-dim); font-size: 12px; }
  #over-act { display: flex; gap: 8px; justify-content: center; margin-top: 16px; }
  #over-act button {
    font: inherit; color: inherit; border: 1px solid var(--line); border-radius: 5px;
    padding: 5px 14px; background: #fff; cursor: pointer;
  }
  #over-act button:hover { background: #f2f2f2; }
  #over-act button.danger { color: var(--red); border-color: #f0c8c4; }
  #over-act button.danger:hover { background: #fdf2f1; }
  #over-act.off { display: none; }
</style>

<div id="bar">
  <span id="dot"></span>
  <span id="hdr">等待开局…</span>
  <span class="sp"></span>
  <span id="meta"></span>
  <button id="exit">退出</button>
</div>

<div id="menu"><div class="box">
  <h4>退出</h4>
  <button id="m-back">返回<small>关掉这个菜单,继续这一局</small></button>
  <button id="m-restart">再来一局<small>放弃当前对局,重新开始</small></button>
  <button id="m-quit" class="danger">结束游戏<small>关掉服务端进程,等同于命令行里 Ctrl+C</small></button>
  <div id="m-err" class="err"></div>
</div></div>

<div id="table">
  <div id="bottom">
    <div id="me"></div>
    <div id="act"></div>
  </div>
  <div id="mid">
    <div id="tray"></div>
    <div id="logbox">
      <div id="loghd"><span id="caret">▼</span><span>战报</span><span class="sp"></span><span id="logn"></span></div>
      <div id="log"></div>
    </div>
    <div id="deckinfo"></div>
  </div>
</div>

<div id="over"><div>
  <span id="overtxt"></span><small id="oversub"></small>
  <div id="over-act">
    <button id="o-back">返回</button>
    <button id="o-again">再来一局</button>
    <button id="o-quit" class="danger">结束游戏</button>
  </div>
</div></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

// 逆时针:下家在右,沿右侧向上、经顶部、从左侧下来,上家落在左下。
// 必须和 state.ts 里的 RING_BY_COUNT 保持一致。
const RING = ['br', 'r', 'tr', 't', 'tl', 'l', 'bl'];
const RING_BY_COUNT = {
  1: ['t'],
  2: ['tr', 'tl'],
  3: ['r', 't', 'l'],
  4: ['r', 'tr', 'tl', 'l'],
  5: ['r', 'tr', 't', 'tl', 'l'],
  6: ['br', 'r', 'tr', 'tl', 'l', 'bl'],
  7: RING,
};

// ————————————————— 选择状态 —————————————————
//
// sel 存的是**选项下标**(有序,观星要按顺序放牌堆顶)。
// 界面上点角色框/手牌/技能,都是在往 sel 里加减一个下标 —— 引擎那边只认编号。

let st = null;          // 最新快照
let sel = [];           // 选中的选项下标
let errMsg = '';
let sending = false;

const pend = () => (st && st.pending) || null;

/** 某个实体对应哪个选项下标;-1 表示这次不能点它 */
// items 是**可选的附加信息**,永远以 options 为准枚举选项。
// 这条是血的教训:items 曾经串味成空数组,前端照着它枚举,结果一个按钮都没渲染,
// 牌局直接卡死。选项列表来自引擎,它才是唯一可信的那份。
const itemAt = (p, i) => (p.items && p.items[i]) || { kind: 'plain' };

function idxOfCard(cardId) {
  const p = pend(); if (!p) return -1;
  // 只映射"一个选项 = 一张牌"的情况。丈八蛇矛那种两张牌当一张用的,
  // 点单张会有歧义,统一落到按钮区,保证每个选项都够得着。
  return p.options.findIndex((_, i) => {
    const it = itemAt(p, i);
    return it.kind === 'card' && it.ids.length === 1 && it.ids[0] === cardId;
  });
}
function idxOfSeat(seat) {
  const p = pend(); if (!p) return -1;
  return p.options.findIndex((_, i) => {
    const it = itemAt(p, i);
    return it.kind === 'player' && it.seat === seat;
  });
}
/** 这道题是不是"选角色" —— 决定要不要把够不着的角色框压灰 */
function anySeatPickable() {
  const p = pend(); if (!p) return false;
  return p.options.some((_, i) => itemAt(p, i).kind === 'player');
}
function idxOfSkill(name) {
  const p = pend(); if (!p) return -1;
  return p.options.findIndex((_, i) => {
    const it = itemAt(p, i);
    return it.kind === 'skill' && it.name === name;
  });
}
/**
 * 该摊在中央牌堆里的选项:候选**本身是一张牌**、而且**不在我手上**。
 * 五谷丰登的候选、观星的牌堆顶都属于这类;弃牌选的是自己的手牌,那在下面的面板里点。
 */
function trayOptions() {
  const p = pend(); if (!p) return [];
  const meSeat = st.viewer;
  const mine = new Set(meSeat === null ? [] : (st.seats[meSeat].hand || []).map(c => c.id));
  const out = [];
  p.options.forEach((_, i) => {
    const it = itemAt(p, i);
    if (it.kind !== 'card' || !it.ids.length) return;
    if (it.ids.some(id => mine.has(id))) return;      // 自己的手牌不进牌堆
    out.push(i);
  });
  return out;
}

/** 从选项文本里抠出花色点数,好把红牌画成红的 */
function chipHtml(label, i) {
  const m = label.match(/^(.*?)\[([♠♥♣♦])(\S+?)\]/);
  const at = sel.indexOf(i);
  const cls = ['card', 'pick'];
  if (m && (m[2] === '♥' || m[2] === '♦')) cls.push('red');
  if (at >= 0) cls.push('on');
  const ord = (at >= 0 && pend().ordered) ? `<span class="ord">${at + 1}</span>` : '';
  const body = m
    ? `<span class="s">${esc(m[2])}${esc(m[3])}</span><span class="n">${esc(m[1])}</span>`
    : `<span class="n">${esc(label)}</span>`;
  return `<span class="${cls.join(' ')}" data-opt="${i}">${ord}${body}</span>`;
}

/** 已经能在界面上点到的选项下标 —— 其余的要在按钮区补出来 */
function clickable() {
  const p = pend(); if (!p) return new Set();
  const out = new Set();
  const meSeat = st.viewer;
  const mine = meSeat === null ? [] : (st.seats[meSeat].hand || []);
  mine.forEach(c => { const i = idxOfCard(c.id); if (i >= 0) out.add(i); });
  // 自己的装备同样点得到(离间弃装备、武圣拿装备当素材)
  if (meSeat !== null) {
    st.seats[meSeat].equips.forEach(e => { const i = idxOfCard(e.card.id); if (i >= 0) out.add(i); });
  }
  st.seats.forEach(s => { const i = idxOfSeat(s.seat); if (i >= 0) out.add(i); });
  if (meSeat !== null) {
    st.seats[meSeat].skills.forEach(n => { const i = idxOfSkill(n); if (i >= 0) out.add(i); });
  }
  // 摊在中央牌堆里的也算"点得到",不再重复铺成按钮
  for (const i of trayOptions()) out.add(i);
  return out;
}

function toggle(i) {
  const p = pend(); if (!p || i < 0 || sending) return;
  const at = sel.indexOf(i);
  if (at >= 0) sel.splice(at, 1);
  else if (p.max === 1) sel = [i];          // 单选:点新的就换掉旧的
  else if (sel.length < p.max) sel.push(i);
  else return;
  errMsg = '';
  // 只有一个答案的题(出杀、出闪、选唯一目标)点一下就走,不用再确认
  if (p.min === 1 && p.max === 1 && sel.length === 1) send();
  else render(st);
}

async function send() {
  const p = pend(); if (!p || sending) return;
  sending = true;
  render(st);
  try {
    const r = await fetch('/api/decide', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ choice: sel }),
    });
    const j = await r.json();
    if (!r.ok) { errMsg = j.error || '提交失败'; sending = false; render(st); return; }
    sel = []; errMsg = '';
    // 成功之后不用自己重画:引擎会继续跑,下一帧快照自然推过来
  } catch (e) {
    errMsg = String(e.message || e);
  }
  sending = false;
}

// ————————————————— 渲染 —————————————————

/** mode: 'hand' 自己的手牌(可点) | false 只读 */
function cardHtml(c, mode) {
  const cls = ['card'];
  if (c.red) cls.push('red');
  let attr = '', ord = '';

  if (mode === 'hand') {
    const i = idxOfCard(c.id);
    const at = sel.indexOf(i);
    // 有题在等着答,而这张牌不在选项里 —— 压灰。没题的时候手牌一律正常显示
    if (i >= 0) cls.push('pick');
    else if (pend()) cls.push('off');
    if (at >= 0) {
      cls.push('on');
      if (pend() && pend().ordered) ord = `<span class="ord">${at + 1}</span>`;
    }
    if (i >= 0) attr = ` data-opt="${i}"`;
  }
  return `<span class="${cls.join(' ')}"${attr}>` +
    ord + `<span class="s">${esc(c.suit)}${esc(c.rank)}</span><span class="n">${esc(c.name)}</span></span>`;
}

function hpHtml(hp, max) {
  return `<span class="hp">${'♥'.repeat(Math.max(0, hp))}` +
    `<span class="empty">${'♡'.repeat(Math.max(0, max - hp))}</span></span>`;
}

function seatHtml(s, self) {
  const i = idxOfSeat(s.seat);
  const at = sel.indexOf(i);
  const cls = ['seat', s.kingdom];
  if (s.isCurrent) cls.push('cur');
  if (!s.alive) cls.push('dead');
  // 只有"这道题要选人"时才把够不着的人压灰 —— 别的时候角色框是在展示信息
  if (i >= 0) cls.push('pick');
  else if (anySeatPickable()) cls.push('off');
  if (at >= 0) cls.push('on');

  const role = s.roleName
    ? `<span class="role ${s.role}">${esc(s.roleName)}</span>`
    : `<span class="role unknown">身份未知</span>`;

  let h = `<div class="${cls.join(' ')}"${i >= 0 ? ` data-opt="${i}"` : ''}>`;
  if (at >= 0) h += `<span class="ord">${at + 1}</span>`;
  if (s.isCurrent) h += `<span class="badge">${esc(window.__phase || '')}</span>`;
  h += `<div class="head">` +
    `<span class="no">${s.seat}号</span>` +
    `<span class="gen">${esc(s.general)}</span>` +
    `<span class="kd ${s.kingdom}">${esc(s.kingdomName)}</span>` +
    role +
    (s.isViewer ? `<span class="k">(你)</span>` : '') +
    `</div>`;

  if (!s.alive) return h + `<div class="row muted">阵亡</div></div>`;

  h += `<div class="row">${hpHtml(s.hp, s.maxHp)}`;
  if (s.hand) h += `<span class="k">手牌 ${s.handCount}</span>`;
  else h += `<span class="k"><span class="back"></span>${s.handCount}</span>`;
  if (s.distance !== null) {
    h += `<span class="k">距离 ${s.distance}${s.inRange ? ' · 在范围内' : ''}</span>`;
  }
  h += `</div>`;

  if (s.knownHand && s.knownHand.length) {
    h += `<div class="row"><span class="k">已公开</span><span class="cards">` +
      s.knownHand.map(c => cardHtml(c, false)).join('') + `</span></div>`;
  }
  if (s.equips.length) {
    /*
     * **自己的装备要能点。**
     * 离间可以弃装备区的牌、武圣/奇袭可以拿装备当素材 —— 引擎早就把它们放进选项了,
     * 可这里一律按只读画,于是玩家看着自己的装备发灰、只能去操作条里找同名按钮。
     */
    h += `<div class="row"><span class="k">装备</span><span class="cards">` +
      s.equips.map(e => cardHtml(e.card, self ? 'hand' : false)).join('') + `</span></div>`;
  }
  if (s.judge.length) {
    h += `<div class="row"><span class="k">判定</span>` +
      `<span class="judge">${s.judge.map(esc).join(' · ')}</span></div>`;
  }
  if (self) {
    h += `<div class="row"><span class="k">技能</span>` + s.skills.map(n => {
      const si = idxOfSkill(n), sa = sel.indexOf(si);
      const c = ['skill'];
      if (si >= 0) c.push('pick'); else if (pend()) c.push('off');
      if (sa >= 0) c.push('on');
      return `<span class="${c.join(' ')}"${si >= 0 ? ` data-opt="${si}"` : ''}>${esc(n)}</span>`;
    }).join(' ') + `</div>`;
    h += `<div class="row hand"><span class="k">手牌</span><span class="cards">` +
      (s.hand && s.hand.length ? s.hand.map(c => cardHtml(c, 'hand')).join('') : '<span class="muted">无</span>') +
      `</span></div>`;
  }
  return h + `</div>`;
}

function actHtml() {
  const p = pend();
  if (!p) return '';
  const clicked = clickable();
  // 界面上点不到的选项(纯文字选项、结束回合、多张牌合成的一张)全部补成按钮,
  // 保证**任何一个合法选项都够得着**
  const rest = p.options.map((_, i) => i).filter(i => !clicked.has(i));
  const ok = sel.length >= p.min && sel.length <= p.max;
  const range = p.min === p.max ? `选 ${p.min} 个`
    : p.min === 0 ? `选 0~${p.max} 个` : `选 ${p.min}~${p.max} 个`;

  let h = `<div class="q">${esc(p.question)}</div>`;
  // 顺序有意义的题(离间先选的先出【杀】、观星按顺序放牌堆顶):选中的会标 1、2…
  if (p.ordered && p.max > 1) h += `<div class="where">选中的会按点击先后编号,顺序有意义</div>`;

  /*
   * 可点的东西在棋盘上、不在操作条里时,**必须明说**。
   * 真实事故:轮到玩家给【遗计】选目标,操作条里一个按钮都没有(两个角色框才是选项),
   * 玩家以为游戏卡死了。没有这行提示的话,那道题看起来就是个死局。
   */
  if (!rest.length && clicked.size) {
    const kinds = new Set();
    for (const i of clicked) {
      const it = itemAt(p, i);
      const mine = st.viewer !== null && it.kind === 'card'
        && (st.seats[st.viewer].hand || []).some(c => it.ids.includes(c.id));
      kinds.add(it.kind === 'player' ? '角色框'
        : it.kind === 'skill' ? '技能'
          : mine ? '手牌' : '中间摊开的牌');
    }
    h += `<div class="where">↑ 点描蓝的${[...kinds].join(' / ')}来选</div>`;
  }

  if (rest.length) {
    h += `<div class="opts">` + rest.map(i =>
      `<button data-opt="${i}" class="${sel.includes(i) ? 'on' : ''}">${esc(p.options[i])}</button>`
    ).join('') + `</div>`;
  }
  h += `<div class="opts">` +
    `<button class="go" id="go" ${ok && !sending ? '' : 'disabled'}>${sending ? '提交中…' : '确定'}</button>` +
    (p.min === 0
      ? `<button id="pass" ${sending ? 'disabled' : ''}>${p.cancel ? '取消' : '放弃'}</button>`
      : '') +
    `<span class="cnt">${range},已选 ${sel.length}</span>` +
    `</div>`;
  if (errMsg) h += `<div class="err">${esc(errMsg)}</div>`;
  return h;
}

function logHtml(lines) {
  return lines.map(l => {
    let c = '';
    if (l.includes('====')) c = 'rd';
    else if (l.startsWith('---')) c = 'tn';
    else if (l.startsWith('☠')) c = 'die';
    else if (l.includes('点伤害')) c = 'dmg';
    return c ? `<span class="${c}">${esc(l)}</span>` : esc(l);
  }).join('\n');
}

let lastLogLen = -1;
let overShown = false;   // 结束浮层弹过没有

function render(state) {
  st = state;
  window.__phase = st.phaseName;

  $('hdr').textContent = st.over ? '对局结束'
    : `第 ${st.round} 轮 · 回合 ${st.turn} · ${st.current !== null ? st.current + '号' : ''} ${st.phaseName}`;
  $('meta').textContent =
    (st.viewer !== null ? `视角 ${st.viewer}号  ` : '观战  ') + (st.reveal ? '开图  ' : '');

  const n = st.seats.length;
  const viewer = st.viewer === null ? 0 : st.viewer;
  const slots = RING_BY_COUNT[n - 1] || RING.slice(0, n - 1);

  const table = $('table');
  [...table.children].forEach(el => { if (el.id !== 'bottom' && el.id !== 'mid') el.remove(); });

  for (let k = 0; k < n - 1; k++) {
    const s = st.seats[(viewer + 1 + k) % n];
    const box = document.createElement('div');
    box.style.gridArea = slots[k];
    box.innerHTML = seatHtml(s, false);
    table.appendChild(box);
  }

  const tray = trayOptions();
  const trayBox = $('tray');
  trayBox.classList.toggle('on', tray.length > 0);
  if (tray.length) {
    const p = pend();
    const range = p.min === p.max ? `选 ${p.min} 张` : `选 ${p.min}~${p.max} 张`;
    trayBox.innerHTML = `<div class="t">${esc(p.question)} · ${range}` +
      (p.ordered ? '(选中的顺序就是放回牌堆顶的顺序)' : '') + `</div>` +
      `<div class="cards">` + tray.map(i => chipHtml(p.options[i], i)).join('') + `</div>`;
  }

  const act = $('act');
  act.innerHTML = actHtml();
  act.classList.toggle('on', !!pend());

  $('me').innerHTML = st.viewer === null ? '' : seatHtml(st.seats[viewer], true);

  const log = $('log');
  // 用真实总行数判断有没有新内容 —— st.log 只有最近 200 行,长度会封顶
  if (st.logTotal !== lastLogLen) {
    lastLogLen = st.logTotal;
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    log.innerHTML = logHtml(st.log);
    if (atBottom) log.scrollTop = log.scrollHeight;
  }
  $('logn').textContent = st.logTotal > st.log.length
    ? `${st.logTotal} 行(只显示最近 ${st.log.length})`
    : `${st.logTotal} 行`;
  $('deckinfo').innerHTML = `<span>牌堆 ${st.deck}</span><span>弃牌堆 ${st.discard}</span>`;

  if (st.over && !overShown) {
    overShown = true;               // 只自动弹一次;点了"返回"就别再糊上来
    const names = st.winners.map(w => {
      const s = st.seats[w];
      return `${w}号 ${s.general}${s.roleName ? '(' + s.roleName + ')' : ''}`;
    });
    $('overtxt').textContent = names.length ? names.join('、') + ' 获胜' : '平局';
    $('oversub').textContent = st.reason || '';
    $('over-act').classList.remove('off');
    $('over').classList.add('on');
  }
}

// 事件委托:角色框、手牌、技能、按钮都靠 data-opt 认领
document.addEventListener('click', e => {
  const hit = e.target.closest('[data-opt]');
  if (hit) { toggle(Number(hit.dataset.opt)); return; }
  if (e.target.id === 'go') { send(); return; }
  if (e.target.id === 'pass') { sel = []; send(); return; }
});
$('loghd').onclick = () => {
  const b = $('logbox');
  b.classList.toggle('open');
  const log = $('log');
  log.scrollTop = log.scrollHeight;
};

// ————————————————— 退出菜单 —————————————————

const menu = $('menu');
const closeMenu = () => { menu.classList.remove('on'); $('m-err').textContent = ''; };
$('exit').onclick = () => menu.classList.add('on');
$('m-back').onclick = closeMenu;
menu.onclick = e => { if (e.target === menu) closeMenu(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

async function control(path, confirmText) {
  if (confirmText && !confirm(confirmText)) return;
  $('m-err').textContent = '';
  try {
    const r = await fetch(path, { method: 'POST' });
    const j = await r.json();
    if (!r.ok) { $('m-err').textContent = j.error || '操作失败'; return; }
    return j;
  } catch (e) {
    $('m-err').textContent = String(e.message || e);
  }
}

/** 再来一局。牌局已经结束时不用再确认 —— 没有什么可放弃的了 */
async function doAgain() {
  const j = await control('/api/reset', st && st.over ? null : '放弃当前这一局,重新开始?');
  if (!j) return;
  // 设置页那条路要回 / 重新配;npm run ui 直接换个 seed 再来一局,留在原地等新快照
  if (j.go) { location.href = j.go; return; }
  overShown = false;
  $('over').classList.remove('on');
  closeMenu();
}

async function doQuit() {
  const j = await control('/api/quit', '结束游戏并关闭服务端进程?');
  if (!j) return;
  closeMenu();
  $('overtxt').textContent = '游戏已结束';
  $('oversub').textContent = '服务端进程已退出,可以关掉这个页面了。';
  $('over-act').classList.add('off');    // 都退了就没什么可点的了
  $('over').classList.add('on');
}

$('m-restart').onclick = doAgain;
$('m-quit').onclick = doQuit;
$('o-again').onclick = doAgain;
$('o-quit').onclick = doQuit;
// 结束浮层的"返回":关掉提示,回去看最终局面。想再叫出来就点右上角「退出」
$('o-back').onclick = () => $('over').classList.remove('on');

const es = new EventSource('/events');
es.onmessage = e => {
  $('dot').classList.remove('off');
  const next = JSON.parse(e.data);
  // 换了一道新题就把上一题的选择清掉,免得旧下标落到新选项上
  const before = pend();
  if (!next.pending || !before || next.pending.question !== before.question) {
    sel = []; errMsg = '';
  }
  render(next);
};
es.onerror = () => $('dot').classList.add('off');
</script>
